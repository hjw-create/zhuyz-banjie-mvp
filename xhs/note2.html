    <h1 class="title">我们不卖菌剂：观测表能帮什么、不能帮什么</h1>
    <div class="warn"><strong>红线写在最前：</strong>不做工程总包、不卖菌剂、不承诺增产、只做观测提醒。</div>
    <p class="p">有人原话：「网上卖菌剂我不敢信。」也有人说：「节点提醒可以，别一上来保证增产。」</p>
    <p class="p"><strong>能帮你的</strong>：提醒硬度/下渗/改良节点；记下板结观察一句；一页纸、人话、换班也能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不做工程总包、不卖菌剂、不保证增产、不绑菌剂链接。</p>
    <p class="p">红线清楚，你再决定要不要试填。</p>
